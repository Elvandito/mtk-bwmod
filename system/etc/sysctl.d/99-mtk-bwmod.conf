# =============================================================================
# MTK Extreme Bandwidth Mod v1.8 — sysctl.d Configuration
# Author: Elvan
# Applied by: Android init sysctl service (before user space)
# Fallback layer: if init.rc writes fail, sysctl.d picks up the slack
# Universal: All MediaTek devices
# =============================================================================

# ── TCP CORE ──────────────────────────────────────────────────────────────────
net.ipv4.tcp_fastopen                   = 3
net.ipv4.tcp_sack                       = 1
net.ipv4.tcp_fack                       = 1
net.ipv4.tcp_window_scaling             = 1
net.ipv4.tcp_timestamps                 = 1
net.ipv4.tcp_ecn                        = 1
net.ipv4.tcp_ecn_fallback               = 1
net.ipv4.tcp_slow_start_after_idle      = 0
net.ipv4.tcp_keepalive_time             = 30
net.ipv4.tcp_keepalive_intvl            = 10
net.ipv4.tcp_keepalive_probes           = 3
net.ipv4.tcp_fin_timeout                = 15
net.ipv4.tcp_mtu_probing                = 1
net.ipv4.tcp_no_metrics_save            = 1
net.ipv4.tcp_notsent_lowat              = 131072
net.ipv4.tcp_retries2                   = 8
net.ipv4.tcp_syn_retries                = 3

# ── TCP BUFFERS ───────────────────────────────────────────────────────────────
net.core.rmem_max                       = 67108864
net.core.wmem_max                       = 67108864
net.core.rmem_default                   = 4194304
net.core.wmem_default                   = 4194304
net.ipv4.tcp_rmem                       = 4096 1048576 67108864
net.ipv4.tcp_wmem                       = 4096 1048576 67108864

# ── UDP / QUIC ────────────────────────────────────────────────────────────────
net.ipv4.udp_rmem_min                   = 65536
net.ipv4.udp_wmem_min                   = 65536
net.ipv4.udp_mem                        = 65536 131072 262144

# ── LOCAL PORT RANGE ──────────────────────────────────────────────────────────
net.ipv4.ip_local_port_range            = 1024 65535

# ── SOCKET CORE ───────────────────────────────────────────────────────────────
net.core.somaxconn                      = 8192
net.core.netdev_budget                  = 600
net.core.netdev_budget_usecs            = 4000
net.core.netdev_max_backlog             = 32768
net.core.rps_sock_flow_entries          = 32768
net.core.optmem_max                     = 81920

# ── CONNTRACK SCALING ─────────────────────────────────────────────────────────
net.netfilter.nf_conntrack_max                      = 2000000
net.netfilter.nf_conntrack_tcp_timeout_established  = 600
net.netfilter.nf_conntrack_tcp_timeout_time_wait    = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait   = 15
net.netfilter.nf_conntrack_udp_timeout              = 30
net.netfilter.nf_conntrack_udp_timeout_stream       = 120
net.netfilter.nf_conntrack_tcp_loose                = 1

# ── ROUTING ───────────────────────────────────────────────────────────────────
net.ipv4.route.gc_timeout               = 100
net.ipv4.conf.all.rp_filter             = 1
net.ipv4.conf.default.rp_filter         = 1
net.ipv4.conf.all.accept_source_route   = 0
net.ipv4.conf.all.accept_redirects      = 0
net.ipv4.conf.all.send_redirects        = 0

# ── IPv6 ──────────────────────────────────────────────────────────────────────
net.ipv6.conf.all.accept_redirects      = 0
net.ipv6.conf.default.accept_redirects  = 0
